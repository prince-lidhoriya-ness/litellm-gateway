# Lint configuration used by CI (.github/workflows/ci.yml). Deliberately narrow: errors that break code (syntax errors,
# undefined names, unused or shadowed imports, invalid comparisons), not style. Widen it as the code is cleaned up.
line-length = 120
target-version = "py312"
extend-exclude = [".venv", ".venv-compression", "reports"]

[lint]
select = ["E9", "F63", "F7", "F82", "F401", "F811"]

[lint.per-file-ignores]
# Package re-exports and pytest fixtures imported for use as fixtures.
"**/__init__.py" = ["F401"]
"**/tests/*.py" = ["F401", "F811"]
