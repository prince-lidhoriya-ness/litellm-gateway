# Minimal sample LiteLLM proxy config with the prompt-compression pipeline, for running the proxy locally without
# Docker (prompt_compression/, see prompt_compression/README.md). docker-compose.quickstart.yml does NOT use this file:
# it mounts litellm_config.yaml, which also carries the observability callbacks, timeouts, retries and the cache.
#
#   litellm --config config.yaml --port 4000
#
# One model entry. By default it points at the local mock provider used for
# verification (prompt_compression/dev/mock_openai_server.py). For a real
# provider, swap it for the commented entry and set OPENAI_API_KEY.
model_list:
  - model_name: mock-echo
    litellm_params:
      model: openai/mock-echo
      api_base: os.environ/MOCK_LLM_API_BASE
      api_key: os.environ/MOCK_LLM_API_KEY
  # - model_name: gpt-4o-mini
  #   litellm_params:
  #     model: openai/gpt-4o-mini
  #     api_key: os.environ/OPENAI_API_KEY

litellm_settings:
  # Resolved relative to this file: loads context_engineering/callback.py, then
  # prompt_compression/prompt_compression_callback.py, and runs their async_pre_call_hooks in this order before every
  # chat/completions provider call. Drop the first entry to run compression alone.
  callbacks: ["context_engineering.callback.context_engineering_instance", "prompt_compression.prompt_compression_callback.prompt_compression_instance"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
