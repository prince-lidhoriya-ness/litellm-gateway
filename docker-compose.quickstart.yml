# LiteLLM quickstart stack: the gateway plus a Postgres database that stores
# models, virtual keys, and spend logs. Used by
# https://docs.litellm.ai/docs/proxy/docker_quick_start
#
#   curl -sSLO https://github.com/BerriAI/litellm/raw/main/docker/docker-compose.quickstart.yml
#   printf 'LITELLM_MASTER_KEY=sk-%s\nLITELLM_SALT_KEY=sk-%s\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" > .env
#   docker compose -f docker-compose.quickstart.yml up -d
#
# Compose reads .env from this directory. Keep it: regenerating LITELLM_SALT_KEY
# makes credentials already stored in the database unreadable. The image is pinned
# (Dockerfile: LiteLLM v1.106.0 by digest, pinned packages, models baked in).
#
# Redis backs shared rate limits/budgets/router state/cache across workers.
# Set REDIS_PASSWORD in .env (any random string, e.g. openssl rand -hex 32).
#
# Full request tracing (HTTP -> auth -> guardrails -> LLM call -> DB writes) ships
# to Langfuse via the OTel v2 integration. Set LANGFUSE_PUBLIC_KEY/LANGFUSE_SECRET_KEY
# in .env (from https://cloud.langfuse.com, or your self-hosted instance + LANGFUSE_HOST).
# See https://docs.litellm.ai/docs/observability/opentelemetry_v2
services:
  litellm:
    # Dockerfile extends the stock image with the llmlingua package (used by prompt_compression/).
    build:
      context: .
      dockerfile: Dockerfile
    image: litellm-gateway:llmlingua
    restart: unless-stopped
    ports:
      # Listens on this machine only unless LITELLM_BIND says otherwise (set it to "0.0.0.0:" only behind a TLS reverse
      # proxy: /metrics is unauthenticated, see litellm_config.yaml). PROJECT_AUDIT_REPORT.md, F-16S.
      - "${LITELLM_BIND:-127.0.0.1:}${LITELLM_PORT:-4000}:4000"
    # Each worker holds its own copy of both models (about 1 GB); size the limit to NUM_WORKERS.
    mem_limit: ${LITELLM_MEM_LIMIT:-6g}
    cpus: ${LITELLM_CPUS:-8}
    healthcheck:
      # The image has no curl; its own Python is enough. start_period covers the model load (about 10 s per worker).
      test: ["CMD", "/app/.venv/bin/python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
      # gate -> segment/classify -> route -> actions -> reassemble pipeline loaded by litellm_config.yaml (see prompt_compression/README.md).
      - ./prompt_compression:/app/prompt_compression
      # Context engineering stage, runs before compression (context_engineering/README.md). Pure Python, no models.
      - ./context_engineering:/app/context_engineering
      # Model weights are baked into the image (Dockerfile, HF_HOME=/opt/hf); no cache volume is needed.
      # Spans, prompt_pipeline_* metrics and JSON logs around the pipeline (see docs/monitoring-plan.md).
      - ./observability:/app/observability
    command: ["--config", "/app/config.yaml"]
    environment:
      # Proxy worker processes. Each one loads its own classifier + LLMLingua-2 copy (about 1 GB RAM) and runs
      # their calls in parallel with the others; with 1 worker every model call in the gateway is serialized
      # (evals/REPORT.md, 4.1). LiteLLM shares Prometheus metrics across workers on its own (PROMETHEUS_MULTIPROC_DIR).
      # Measured on 8 vCPUs, 120 mixed requests at concurrency 8 (reports/playground-ab/raw/throughput_U_*):
      #   1 worker x 8 threads: 8.1-8.7 req/s compressed   2 x 4: 12.7-13.1   4 x 2: 8.7 (LLMLingua-2 starved of threads)
      NUM_WORKERS: ${LITELLM_NUM_WORKERS:-2}
      # Torch threads per worker: workers x threads = the container's CPUs (8 here).
      OMP_NUM_THREADS: ${PROMPT_COMPRESSION_TORCH_THREADS:-4}
      # prompt_compression/ settings (prompt_compression.env.example). Empty = the code default.
      PROMPT_COMPRESSION_ENABLED: ${PROMPT_COMPRESSION_ENABLED:-}
      PROMPT_COMPRESSION_MODE: ${PROMPT_COMPRESSION_MODE:-}
      PROMPT_COMPRESSION_FAIL_MODE: ${PROMPT_COMPRESSION_FAIL_MODE:-}
      PROMPT_COMPRESSION_TIMEOUT_S: ${PROMPT_COMPRESSION_TIMEOUT_S:-}
      PROMPT_COMPRESSION_MIN_TOKENS: ${PROMPT_COMPRESSION_MIN_TOKENS:-}
      PROMPT_COMPRESSION_ROUTES: ${PROMPT_COMPRESSION_ROUTES:-}
      PROMPT_COMPRESSION_RATE: ${PROMPT_COMPRESSION_RATE:-}
      PROMPT_COMPRESSION_MAX_RATIO: ${PROMPT_COMPRESSION_MAX_RATIO:-}
      PROMPT_COMPRESSION_MAX_INPUT_TOKENS: ${PROMPT_COMPRESSION_MAX_INPUT_TOKENS:-}
      PROMPT_COMPRESSION_MAX_CALLS_PER_REQUEST: ${PROMPT_COMPRESSION_MAX_CALLS_PER_REQUEST:-}
      PROMPT_COMPRESSION_MAX_CONCURRENCY: ${PROMPT_COMPRESSION_MAX_CONCURRENCY:-}
      PROMPT_COMPRESSION_SELECTION_SCOPE: ${PROMPT_COMPRESSION_SELECTION_SCOPE:-}
      PROMPT_COMPRESSION_INTENT_GATE: ${PROMPT_COMPRESSION_INTENT_GATE:-}
      PROMPT_COMPRESSION_CACHE_SIZE: ${PROMPT_COMPRESSION_CACHE_SIZE:-}
      PROMPT_COMPRESSION_LOG_LEVEL: ${PROMPT_COMPRESSION_LOG_LEVEL:-}
      # Set to 0 only when you switch to a model that is not baked into the image.
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      TRANSFORMERS_OFFLINE: ${HF_HUB_OFFLINE:-1}
      SENSITIVITY_BACKEND: ${SENSITIVITY_BACKEND:-}
      SENSITIVITY_THRESHOLD: ${SENSITIVITY_THRESHOLD:-}
      REDACT_SENSITIVE: ${REDACT_SENSITIVE:-}
      # context_engineering/ settings (context_engineering.env.example). Empty = the code default.
      CONTEXT_ENGINEERING_ENABLED: ${CONTEXT_ENGINEERING_ENABLED:-}
      CONTEXT_ENGINEERING_MODE: ${CONTEXT_ENGINEERING_MODE:-}
      CONTEXT_ENGINEERING_FAIL_MODE: ${CONTEXT_ENGINEERING_FAIL_MODE:-}
      CONTEXT_ENGINEERING_MIN_TOKENS: ${CONTEXT_ENGINEERING_MIN_TOKENS:-}
      CONTEXT_BUDGET_ENABLED: ${CONTEXT_BUDGET_ENABLED:-}
      CONTEXT_MAX_UTILIZATION: ${CONTEXT_MAX_UTILIZATION:-}
      CONTEXT_RESERVED_OUTPUT_TOKENS: ${CONTEXT_RESERVED_OUTPUT_TOKENS:-}
      CONTEXT_SAFETY_BUFFER: ${CONTEXT_SAFETY_BUFFER:-}
      CONTEXT_DEFAULT_WINDOW_TOKENS: ${CONTEXT_DEFAULT_WINDOW_TOKENS:-}
      CONTEXT_RECENT_TURNS: ${CONTEXT_RECENT_TURNS:-}
      OBSERVATION_MASKING_ENABLED: ${OBSERVATION_MASKING_ENABLED:-}
      OBSERVATION_MAX_TOKENS: ${OBSERVATION_MAX_TOKENS:-}
      OBSERVATION_KEEP_RECENT: ${OBSERVATION_KEEP_RECENT:-}
      JIT_RETRIEVAL_ENABLED: ${JIT_RETRIEVAL_ENABLED:-}
      JIT_RETRIEVAL_MAX_TURNS: ${JIT_RETRIEVAL_MAX_TURNS:-}
      CONTEXT_COMPACTION_ENABLED: ${CONTEXT_COMPACTION_ENABLED:-}
      CONTEXT_COMPACTION_THRESHOLD: ${CONTEXT_COMPACTION_THRESHOLD:-}
      CONTEXT_COMPACTION_MODE: ${CONTEXT_COMPACTION_MODE:-}
      CONTEXT_COMPACTION_MODEL: ${CONTEXT_COMPACTION_MODEL:-}
      PREFIX_CACHE_OPTIMIZATION_ENABLED: ${PREFIX_CACHE_OPTIMIZATION_ENABLED:-}
      PREFIX_CACHE_PROVIDER_SUPPORT: ${PREFIX_CACHE_PROVIDER_SUPPORT:-}
      PREFIX_CACHE_INJECT_BREAKPOINTS: ${PREFIX_CACHE_INJECT_BREAKPOINTS:-}
      # memory (per worker) or redis (the stack's Redis below, shared, readable by context_engineering/recover.py)
      CONTEXT_STORE: ${CONTEXT_STORE:-}
      CONTEXT_STORE_TTL_S: ${CONTEXT_STORE_TTL_S:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set it in .env - see the header of this file}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?set it in .env - see the header of this file}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD:?set it in .env - see the header of this file}@db:5432/litellm
      STORE_MODEL_IN_DB: "True"
      # OpenTelemetry v2 (one trace per request: HTTP -> auth -> guardrails -> LLM call -> DB writes).
      # The otel and langfuse_otel callbacks (set in config.yaml) share it: base exporter -> the
      # monitoring stack's collector (monitoring/docker-compose.monitoring.yml), plus Langfuse.
      LITELLM_OTEL_V2: ${LITELLM_OTEL_V2:-true}
      OTEL_EXPORTER: ${OTEL_EXPORTER:-otlp_http}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-litellm-gateway}
      OTEL_ENVIRONMENT_NAME: ${OTEL_ENVIRONMENT_NAME:-local}
      # Head sampling (no sampler code in LiteLLM; the OTel SDK reads these). 1.0 = every request.
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?set it in .env - get it from https://cloud.langfuse.com}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?set it in .env - get it from https://cloud.langfuse.com}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://us.cloud.langfuse.com}
      # no_content keeps prompts/responses out of traces (litellm_settings.turn_off_message_logging also
      # scrubs them); span_only would capture them.
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: ${OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT:-no_content}
      # observability/ (see monitoring/monitoring.env.example for every variable)
      OBS_ENABLED: ${OBS_ENABLED:-true}
      OBS_OTLP_LOGS_ENDPOINT: ${OBS_OTLP_LOGS_ENDPOINT:-http://otel-collector:4318/v1/logs}
      # Key for the user/team/message hashes. Empty = derived from LITELLM_SALT_KEY (observability/settings.py).
      OBS_HASH_SALT: ${OBS_HASH_SALT:-}
      OBS_CAPTURE_TEXT: ${OBS_CAPTURE_TEXT:-false}
      OBS_CPU_HOURLY_RATE_USD: ${OBS_CPU_HOURLY_RATE_USD:-0.10}
      OBS_GPU_HOURLY_RATE_USD: ${OBS_GPU_HOURLY_RATE_USD:-0}
      OBS_COMPUTE_DEVICE: ${OBS_COMPUTE_DEVICE:-cpu}
      # obs-priced-llama in litellm_config.yaml: the host's Ollama.
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      # obs-mock (overhead measurement): mock provider on the host.
      MOCK_LLM_API_BASE: ${MOCK_LLM_API_BASE:-http://host.docker.internal:4010/v1}
      MOCK_LLM_API_KEY: ${MOCK_LLM_API_KEY:-mock-not-a-secret}
      # judge-nemotron in litellm_config.yaml (optional LLM-as-judge); set it in .env.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Shares rate limits, budgets, router state, and cache across all workers/replicas.
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set it in .env - see the header of this file}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env - see the header of this file}
      POSTGRES_DB: litellm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set it in .env - see the header of this file}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set it in .env - see the header of this file}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
