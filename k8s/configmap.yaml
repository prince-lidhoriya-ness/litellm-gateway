apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-gateway-config
  namespace: litellm-gateway
data:
  NUM_WORKERS: "2"
  OMP_NUM_THREADS: "4"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  STORE_MODEL_IN_DB: "True"
  REDIS_HOST: "<elasticache-endpoint>"
  REDIS_PORT: "6379"
  LITELLM_OTEL_V2: "true"
  OTEL_EXPORTER: "otlp_http"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.monitoring.svc.cluster.local:4318"
  OTEL_SERVICE_NAME: "litellm-gateway"
  OTEL_ENVIRONMENT_NAME: "production"
  OBS_ENABLED: "true"
  OBS_CAPTURE_TEXT: "false"
  # Prompt optimisation: safe production defaults (reports/production-readiness-audit/STRATEGY.md, Phase 0, N2).
  # Both stages run in shadow mode: they compute and report what they would save, but the provider receives the
  # original request. Switch a stage to "enforce" only after the Phase 2 holdout shows billed-cost and quality results.
  PROMPT_COMPRESSION_MODE: "shadow"
  CONTEXT_ENGINEERING_MODE: "shadow"
  PROMPT_COMPRESSION_FAIL_MODE: "open"
  CONTEXT_ENGINEERING_FAIL_MODE: "open"
  # Identifier-safe prose compression and log template folding (question-independent, every fold leaves a marker and
  # passes the fidelity guard). Record and passage selection stay opt-in: they deleted the answer on wording alone in
  # the audit (C1) and now run only on a lookup intent under context pressure; add them per deployment once the shadow
  # data (prompt_pipeline_fidelity_total, reverted / checked) supports it.
  PROMPT_COMPRESSION_ROUTES: "narrative,logfold"
  # Mask old tool outputs only when the budget needs it, not at 14% utilization (audit H1).
  OBSERVATION_MASK_TRIGGER: "pressure"
  # The store is never needed for correctness (the client resends the history) and a Redis outage made every request
  # 2 s slower (audit M1).
  CONTEXT_STORE: "none"
  # Measurement (STRATEGY.md, Phase 2): 5% of conversations are held out (sent unoptimised) once a stage runs in
  # enforce mode; in shadow mode both arms already send the original. Billed cost per arm: gateway_holdout_* metrics and
  # observability/holdout_report.sql over the spend logs.
  GATEWAY_HOLDOUT_SHARE: "0.05"
  # Sampled quality checks re-run 1% of optimised requests on the original prompt (an extra billed call each). Off
  # until enforce mode; "judge" mode needs GATEWAY_QUALITY_JUDGE_MODEL on a paid or self-hosted deployment (audit L2).
  GATEWAY_QUALITY_SAMPLE_RATE: "0"
  GATEWAY_QUALITY_MODE: "facts"
