# This file is a TEMPLATE only. Do not commit real secret values to git.
#
# Preferred approach: use the External Secrets Operator (or the AWS Secrets
# and Configuration Provider for the Secrets Store CSI Driver) to sync values
# from AWS Secrets Manager into the cluster instead of hand-writing a Secret
# manifest. See docs/aws-eks-deployment.md section 6.
#
# For a first pass without External Secrets, create the Secret imperatively
# instead of applying this file, so values never touch disk/git history:
#
#   kubectl create secret generic litellm-gateway-secrets \
#     --namespace litellm-gateway \
#     --from-literal=LITELLM_MASTER_KEY=sk-... \
#     --from-literal=LITELLM_SALT_KEY=sk-... \
#     --from-literal=DATABASE_URL=postgresql://litellm:...@<rds-endpoint>:5432/litellm \
#     --from-literal=REDIS_PASSWORD=... \
#     --from-literal=LANGFUSE_PUBLIC_KEY=pk-lf-... \
#     --from-literal=LANGFUSE_SECRET_KEY=sk-lf-... \
#     --from-literal=OBS_HASH_SALT=...
#
# The manifest below is kept only as a reference for which keys are required
# and the stringData shape External Secrets should produce.
apiVersion: v1
kind: Secret
metadata:
  name: litellm-gateway-secrets
  namespace: litellm-gateway
type: Opaque
stringData:
  LITELLM_MASTER_KEY: "<set via Secrets Manager / openssl rand -hex 32>"
  LITELLM_SALT_KEY: "<set via Secrets Manager / openssl rand -hex 32>"
  DATABASE_URL: "postgresql://litellm:<password>@<rds-endpoint>:5432/litellm"
  REDIS_PASSWORD: "<set via Secrets Manager>"
  LANGFUSE_PUBLIC_KEY: "pk-lf-..."
  LANGFUSE_SECRET_KEY: "sk-lf-..."
  OBS_HASH_SALT: "<set via Secrets Manager>"
