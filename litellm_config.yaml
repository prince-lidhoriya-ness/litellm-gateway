# Logging + observability config. Models stay managed via the Admin UI/DB (STORE_MODEL_IN_DB=True);
# the one model_list entry below exists only to exercise non-zero cost end to end.
model_list:
  # Local Ollama llama3.2:3b with TEST prices (not real provider prices), so spend, budgets and
  # Langfuse cost are non-zero during verification. See docs/monitoring-plan.md "Cost model".
  - model_name: obs-priced-llama
    litellm_params:
      model: ollama_chat/llama3.2:3b
      api_base: os.environ/OLLAMA_API_BASE
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000002

  # Optional LLM-as-judge for quality evaluations (must differ from the model under test). Callers opt out of
  # compression with metadata.prompt_compression=false so the judge sees the text verbatim.
  # NOTE: a ":free" OpenRouter model is rate-limited and can disappear; point this at a paid or self-hosted
  # deployment before relying on judge scores (PROJECT_AUDIT_REPORT.md, F-01).
  - model_name: judge-nemotron
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 120

  # Fixed-latency local mock (prompt_compression/dev/mock_openai_server.py on the host, port 4010):
  # used only to measure gateway/telemetry overhead without provider noise.
  - model_name: obs-mock
    litellm_params:
      model: openai/mock-echo
      api_base: os.environ/MOCK_LLM_API_BASE
      api_key: os.environ/MOCK_LLM_API_KEY

litellm_settings:
  # otel + langfuse_otel share LiteLLM's OTel V2 TracerProvider (LITELLM_OTEL_V2=true): one trace per
  # request goes to the collector (Jaeger) and to Langfuse. prometheus serves /metrics.
  # The context-engineering stage (context_engineering/README.md: budget, observation masking, optional JIT retrieval
  # and compaction, cache-aware construction) must come BEFORE the compression hook: LiteLLM runs pre-call hooks in
  # this order and the compression hook reads the stage's hints. Remove the entry (or CONTEXT_ENGINEERING_ENABLED=false)
  # to run compression alone.
  # The last entry is prompt_compression's hook wrapped with spans/metrics/JSON logs
  # (observability/observed_callback.py). Swap it for
  # "prompt_compression.prompt_compression_callback.prompt_compression_instance" to drop the
  # observability layer (never both).
  callbacks: ["otel", "langfuse_otel", "prometheus", "context_engineering.callback.context_engineering_instance", "observability.observed_callback.observed_prompt_compression_instance"]
  # Message text is scrubbed from every logging callback (Langfuse, OTel, custom loggers).
  turn_off_message_logging: true
  # /metrics is scraped inside the docker network. The proxy port is bound to 127.0.0.1 by default (LITELLM_BIND in
  # docker-compose.quickstart.yml); if you publish it on other interfaces, set this to true and give Prometheus a key.
  require_auth_for_metrics_endpoint: false
  # Identity labels stay out of Prometheus; per-user cost lives in Langfuse and spend logs.
  prometheus_exclude_labels: ["end_user", "user", "user_email", "user_alias", "api_key_alias", "client_ip", "user_agent"]
  # Upper bound for any provider call that sets no timeout of its own. LiteLLM's default is 6,000 s, which let a hung
  # provider hold a client connection for 100 minutes (PROJECT_AUDIT_REPORT.md, F-01).
  request_timeout: 600
  # Response cache in the same Redis that holds rate limits and budgets. Opt-in per request ("default_off"): a client
  # sends {"cache": {"use-cache": true}} (or a key/team sets it), so nobody gets a cached answer without asking for one.
  # The key is computed after the pre-call hook, i.e. over the compressed prompt, which is deterministic.
  cache: true
  cache_params:
    type: redis
    mode: default_off
    ttl: 600
    supported_call_types: ["acompletion", "completion"]

# Reliability for every model group, including the ones stored in the DB (PROJECT_AUDIT_REPORT.md, F-01).
router_settings:
  # Per-attempt timeouts (seconds). stream_timeout bounds streaming calls.
  timeout: 120
  stream_timeout: 300
  num_retries: 2
  # Retry what is transient; never retry a request the provider rejected on its merits.
  retry_policy:
    BadRequestErrorRetries: 0
    AuthenticationErrorRetries: 0
    ContentPolicyViolationErrorRetries: 0
    TimeoutErrorRetries: 1
    RateLimitErrorRetries: 3
    InternalServerErrorRetries: 2
    ServiceUnavailableErrorRetries: 2
  # A deployment that fails this many times within a minute is cooled down for cooldown_time seconds, so traffic goes
  # to its siblings (add a second deployment with the same model_name to give a model group somewhere to go).
  allowed_fails: 3
  cooldown_time: 30
  # Shared router state across workers and replicas (cooldowns, usage).
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  redis_password: os.environ/REDIS_PASSWORD
  # Fallbacks between model groups. Every entry needs a second, independent model group; the local test models
  # here have none, so the list is empty. Example for real deployments:
  #   fallbacks: [{"gpt-4o": ["claude-sonnet"]}]
  #   context_window_fallbacks: [{"gpt-4o-mini": ["gpt-4o"]}]
  fallbacks: []

general_settings:
  maximum_spend_logs_retention_period: "30d"
