- id: sensitive-passage-kept
  critical: true
  name: A health passage inside a long document is never dropped or compressed
  request:
    method: POST
    path: /v1/chat/completions
    headers:
      Authorization: Bearer {{env:LITELLM_MASTER_KEY}}
    body:
      model: obs-mock
      messages:
      - role: user
        content: '[req:evalcase]

          Answer the question using only the document below. Reply with only the answer value (a name, number or identifier), nothing else.


          Document:

          A number of universities have launched joint programmes with local employers, offering placements that allow students to work on real
          production problems during their studies.


          The Pryworks-804 line launched in September 1990 at a price of $805, and the first batch sold 7867 units in 17 days.


          For fiscal 2016 Dorvance reported revenue of $50.4 million, a rise of 15 percent, against operating costs of $19.5 million.


          Customers frequently cite reliability and after-sales support as the deciding factors when choosing between suppliers whose prices differ
          only by a few percentage points.


          The patient was diagnosed with type 2 diabetes in March and is taking metformin 500 mg twice a day, according to the clinic notes shared
          by her physician.


          Industry observers often note that mid-sized manufacturers adapt faster to new standards than their larger competitors, mainly because
          decisions pass through fewer layers of management.


          After 8 years under Alma Tanaka, leadership passed to Alma Voss in 2004, who remains chief executive.


          The story of Dorvance began in Utrecht in 1995, when Yara Nakamura and Inge Delacroix set up a small workshop making cold-chain loggers.


          Recruitment has been a persistent challenge, with employers competing for engineers who combine mechanical training with experience
          in data analysis and automation tools.


          In 1996 the company opened an office in Split, followed by Leeds in 2006 and Gdansk in 2020, and it now employs about 800 people.


          Question: How many units of Pryworks-804 were sold in the first batch?

          Answer:'
      temperature: 0
      max_tokens: 24
  expect:
    status: 200
    json:
      choices.0.message.content:
        contains: The patient was diagnosed with type 2 diabetes in March and is taking metformin 500 mg twice a day, according to the clinic
          notes shared by her physician.
