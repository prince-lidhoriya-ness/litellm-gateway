# Loki 3.7 single-binary, filesystem storage, 7-day retention (see docs/monitoring-plan.md).
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h
  allow_structured_metadata: true
  # OTLP resource attributes promoted to index labels; keep this list low-cardinality.
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes: [service.name, deployment.environment]

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
