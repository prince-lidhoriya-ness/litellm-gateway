# Prometheus v3.15: scrape targets on the litellm-gateway_default network.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # LiteLLM built-in prometheus callback + prompt_pipeline_* (same default registry).
  - job_name: litellm
    metrics_path: /metrics
    static_configs:
      - targets: ["litellm:4000"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # Keep Docker containers (/docker/<id>) and the VM root; add a short container_id label.
      - source_labels: [id]
        regex: "/|/docker/[0-9a-f]+"
        action: keep
      - source_labels: [id]
        regex: "/docker/([0-9a-f]{12})[0-9a-f]*"
        target_label: container_id
        replacement: "$1"

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Only reachable when the gpu profile is running.
  - job_name: dcgm
    static_configs:
      - targets: ["dcgm-exporter:9400"]
