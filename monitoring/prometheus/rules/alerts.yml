# Alert rules (thresholds discussed in docs/monitoring-plan.md; tune per environment).
groups:
  - name: gateway-requests
    rules:
      - alert: GatewayHighP95Latency
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(litellm_request_total_latency_metric_bucket[5m]))) > 20
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "p95 end-to-end latency above 20 s for 5 minutes"
      - alert: GatewayErrorRateHigh
        expr: |
          sum(rate(litellm_proxy_failed_requests_metric_total[5m]))
            / clamp_min(sum(rate(litellm_proxy_total_requests_metric_total[5m])), 1e-9) > 0.05
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "More than 5% of proxy requests failing"
      - alert: GatewayRateLimited
        expr: sum(increase(litellm_proxy_failed_requests_metric_total{status_code="429"}[10m])) > 10
        labels: {severity: warning}
        annotations:
          summary: "More than 10 rate-limited (429) requests in 10 minutes"

  - name: gateway-budgets
    rules:
      - alert: TeamBudgetAlmostSpent
        expr: |
          (litellm_remaining_team_budget_metric / litellm_team_max_budget_metric) < 0.1
            and litellm_team_max_budget_metric > 0
        labels: {severity: warning}
        annotations:
          summary: "Team {{ $labels.team_alias }} has less than 10% budget left"
      - alert: ApiKeyBudgetAlmostSpent
        expr: |
          (litellm_remaining_api_key_budget_metric / litellm_api_key_max_budget_metric) < 0.1
            and litellm_api_key_max_budget_metric > 0
        labels: {severity: warning}
        annotations:
          summary: "An API key has less than 10% budget left"

  - name: prompt-pipeline
    rules:
      - alert: PromptPipelineFailOpenSpike
        expr: sum(increase(prompt_pipeline_failures_total{mode="open"}[10m])) > 5
        labels: {severity: warning}
        annotations:
          summary: "Prompt pipeline failed open more than 5 times in 10 minutes (prompts sent uncompressed)"
      - alert: PromptPipelineFailClosed
        expr: sum(increase(prompt_pipeline_failures_total{mode="closed"}[10m])) > 0
        labels: {severity: critical}
        annotations:
          summary: "Prompt pipeline rejected requests (fail_mode=closed)"
      - alert: PromptPipelineModelNotLoaded
        expr: min by (component) (prompt_pipeline_model_loaded) < 1
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.component }} model failed to load"
      - alert: PromptClassifierSlow
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(prompt_pipeline_classifier_latency_seconds_bucket[10m]))) > 0.3
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Classifier p95 above the 300 ms budget (CLASSIFIER_LATENCY_BUDGET_MS)"

  - name: infrastructure
    rules:
      - alert: ScrapeTargetDown
        expr: up{job!="dcgm"} == 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.job }} target {{ $labels.instance }} is down"
      - alert: ContainerRestarting
        expr: changes(container_start_time_seconds{container_id!=""}[15m]) > 2
        labels: {severity: warning}
        annotations:
          summary: "Container {{ $labels.container_id }} restarted more than twice in 15 minutes (docker ps to map the id)"
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "Postgres (spend logs, keys) unreachable"
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "Redis (rate limits, router state) unreachable"
      - alert: HostMemoryPressure
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.9
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Docker VM memory above 90%"
      - alert: GpuMemoryPressure
        expr: DCGM_FI_DEV_FB_USED / (DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE) > 0.9
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "GPU {{ $labels.gpu }} memory above 90%"
