# OpenTelemetry Collector (contrib 0.164.0): one OTLP entry point for the gateway.
#   traces -> Jaeger (OTLP gRPC)
#   logs   -> Loki (native OTLP endpoint, trace_id/span_id kept as structured metadata)
# Metrics are scraped by Prometheus directly from LiteLLM's /metrics, so no metrics pipeline here.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch:
    send_batch_size: 512
    timeout: 2s
  # Defence in depth: drop attributes that could carry prompt/completion text if an
  # upstream setting is ever flipped. The app never sets these on its own spans.
  attributes/scrub:
    actions:
      - {key: gen_ai.prompt, action: delete}
      - {key: gen_ai.completion, action: delete}
      - {key: gen_ai.input.messages, action: delete}
      - {key: gen_ai.output.messages, action: delete}
      - {key: llm.prompts, action: delete}
      - {key: llm.completions, action: delete}
      - {key: input.value, action: delete}
      - {key: output.value, action: delete}

exporters:
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/scrub, batch]
      exporters: [otlp_grpc/jaeger]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki]
